[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-swe-harness"
version = "0.1.0"
description = "VM harness for benchmark data collection: VM lifecycle management plus host/VM-layer performance recording"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mini-swe-harness = "minisweharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
